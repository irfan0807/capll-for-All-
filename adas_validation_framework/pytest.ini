[pytest]
markers =
    functional: end-to-end positive AEB scenario tests
    negative: negative tests asserting no/incorrect reaction does NOT occur
    boundary: boundary-value tests around ECU decision thresholds
    fault_injection: fault, timeout, and recovery tests

addopts =
    -v
    --strict-markers
    --html=reports/html/report.html
    --self-contained-html
    --alluredir=reports/allure-results

log_cli = false
testpaths = tests
